<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 | صفحه پیدا نشد | آکوا پرو</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/image.png" />
    <meta name="theme-color" content="#0066FF" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Vazirmatn', system-ui, Tahoma, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F8FAFC;
        color: #0F172A;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 480px; }
      .code {
        font-size: 96px;
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(135deg, #0066FF, #00C7BE);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { font-size: 22px; margin: 8px 0 8px; }
      p { color: #64748B; line-height: 1.9; margin-bottom: 24px; }
      .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        font-size: 15px;
      }
      .btn-primary { background: #0066FF; color: #fff; }
      .btn-outline { border: 1.5px solid #E2E8F0; color: #0F172A; }
      .lang-switch { margin-top: 20px; font-size: 13px; color: #64748B; }
      .lang-switch a { padding: 0; background: none; color: #0066FF; font-weight: 700; display: inline; }
      @media (max-width: 480px) { .code { font-size: 72px; } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>صفحه مورد نظر پیدا نشد</h1>
      <p>صفحه‌ای که دنبالش بودید حذف شده یا آدرس آن اشتباه است. از صفحه اصلی ادامه دهید.</p>
      <div class="actions">
        <a class="btn-primary" href="/">بازگشت به صفحه اصلی</a>
        <a class="btn-outline" href="/contact/">تماس با ما</a>
      </div>
      <div class="lang-switch">
        <a href="/en">English</a>
      </div>
    </div>
  </body>
</html>
